

name: Build DhoopKart APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Check Project
        run: |
          echo "Checking DhoopKart project..."
          ls -la
          test -f pubspec.yaml

      - name: Generate Android Project
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android .
          fi

      - name: Show Android Package Name
        run: |
          grep -R "applicationId" android/app/

      - name: Install Dependencies
        run: flutter pub get

      - name: Build DhoopKart APK
        run: flutter build apk --release

      - name: Upload DhoopKart APK
        uses: actions/upload-artifact@v4
        with:
          name: DhoopKart-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
            
